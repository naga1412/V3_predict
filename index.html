<html lang="en">
<head>

<!--
  My Next Prediction v3.0
  ─ Client-side AI trading prediction platform
  ─ Scenario-coverage build (Phase 0 / Foundation)
  ─ No backend, no API keys, no telemetry
-->

<!-- Content Security Policy (scenario #129, #131, #135) -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net;
  style-src  'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src   'self' https://fonts.gstatic.com;
  img-src    'self' data: https:;
  connect-src 'self' wss://stream.binance.com:9443 wss://fstream.binance.com wss://stream.bybit.com wss://ws.okx.com:8443 https://api.binance.com https://fapi.binance.com https://api.bybit.com https://www.okx.com http://localhost:11434 https:;
  worker-src 'self' blob:;
  frame-src  'none';
  object-src 'none';
  base-uri   'self';
">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232962ff'/%3E%3Ctext x='8' y='11' font-size='10' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="./public/theme.css" />

<!-- CDN deps (SRI hashes kept empty for local-dev; populate before production) -->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
</head>
<body>

<noscript>
  <div class="noscript">
    My Next Prediction requires JavaScript to run. Please enable it and reload.
  </div>
</noscript>

<!-- Splash while we warm up (removed on app mount) -->
<div id="mnp-splash" class="splash" role="status" aria-live="polite">
  <div class="splash-logo">MNP</div>
  <div class="splash-tag">My Next Prediction · v3.0</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  <div id="mnp-splash-step" class="splash-step">booting…</div>
</div>

<!-- React root -->
<main id="root" aria-label="Main application"></main>

<!-- Live region for price/status announcements (a11y #126) -->
<div id="mnp-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- Phase-1 bootstrap: capability probe → SW register → data layer → module loader -->
<!-- The ?v= query busts the browser's ES-module graph cache when we change  -->
<!-- the data-layer surface exposed on window.__MNP__.                         -->
<script type="module">
  const V = "phase11.0-1";
  // Pick the first non-data: URL as the resolution base.
  function findBase() {
    for (const u of [window.location?.href, document.baseURI, import.meta.url]) {
      if (u && !u.startsWith("data:") && !u.startsWith("blob:")) return u;
    }
    return window.location?.href || null;
  }
  const base = findBase();
  // On file:// origins Chrome cannot fetch modules with a query-string
  // (?v= is not valid in the file-system URL space). Only append ?v= on http(s)://.
  const isFile = base?.startsWith("file:");
  const spec = base
    ? (isFile
        ? new URL(`./src/core/bootstrap.js`, base).href
        : new URL(`./src/core/bootstrap.js?v=${V}`, base).href)
    : `./src/core/bootstrap.js`;
  import(spec).then(m => m.boot()).catch(err => {
    console.error("[MNP] boot failed", err, "spec=", spec, "base=", base);
    const el = document.getElementById("mnp-splash-step");
    if (el) { el.textContent = "boot failed: " + (err?.message || err); el.classList.add("err"); }
  });
</script>

<!-- App (Babel-transpiled JSX; in production we will precompile via SW cache) -->
<!-- No ?v= cache-bust: on file:// Chrome rejects query-strings on filesystem URLs. -->
<!-- For cache-busting during dev, hard-reload (Ctrl+Shift+R). -->
<script type="text/babel" data-type="module" data-presets="env,react" src="./src/ui/App.jsx"></script>

</body>
</html>
