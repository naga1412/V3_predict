<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MNP · Phase 3 unit tests</title>
<style>
  body { background:#131722; color:#d1d4dc; font:13px/1.5 monospace; padding:20px; }
  .pass { color:#26a69a; }
  .fail { color:#ef5350; }
  .group { margin-top: 12px; font-weight:bold; color:#2962ff; }
  h1 { color:#fff; font-size:18px; }
  #out { white-space: pre-wrap; }
  .note { color:#787b86; }
</style>
</head>
<body>
<h1>MNP — Phase 3 unit tests</h1>
<div id="out">running…</div>

<script type="module">
const out = document.getElementById("out");
// Surface any error so the page never silently sits at "running…"
window.addEventListener("error", (e) => {
  out.innerHTML = `<span class="fail">✗ ${e.message}</span>\n<span class="note">${e.filename}:${e.lineno}:${e.colno}</span>`;
});
window.addEventListener("unhandledrejection", (e) => {
  out.innerHTML = `<span class="fail">✗ unhandled: ${e.reason?.message || e.reason}</span>\n<span class="note">${e.reason?.stack || ''}</span>`;
});

const V = "p3-" + Date.now();
// Pick the first non-data: URL we can find.
function findBase() {
  for (const u of [window.location?.href, document.baseURI, import.meta.url]) {
    if (u && !u.startsWith("data:") && !u.startsWith("blob:")) return u;
  }
  return window.location?.href || "file:///";
}
const BASE = findBase();
// On file:// origins, query strings break module fetching (the browser
// looks up a literal file named "foo.js?v=..." which doesn't exist).
// On http(s)://, query strings are the standard cache-buster.
const IS_FILE = BASE.startsWith("file:");
const U = (p) => {
  const url = new URL(p, BASE).href;
  return IS_FILE ? url : `${url}?v=${V}`;
};
let Math_, Moving, Osc, Bands, Vol, Volu, Patterns, Swings, Bos, Fvg, SR, Eng;
try {
  [Math_, Moving, Osc, Bands, Vol, Volu, Patterns, Swings, Bos, Fvg, SR, Eng] = await Promise.all([
    import(U(`../src/ta/math.js`)),
    import(U(`../src/ta/indicators/moving.js`)),
    import(U(`../src/ta/indicators/oscillators.js`)),
    import(U(`../src/ta/indicators/bands.js`)),
    import(U(`../src/ta/indicators/volatility.js`)),
    import(U(`../src/ta/indicators/volume.js`)),
    import(U(`../src/ta/patterns/candles.js`)),
    import(U(`../src/ta/structure/swings.js`)),
    import(U(`../src/ta/structure/bos.js`)),
    import(U(`../src/ta/structure/fvg.js`)),
    import(U(`../src/ta/levels/supportResistance.js`)),
    import(U(`../src/ta/engine.js`)),
  ]);
} catch (err) {
  out.innerHTML = `<span class="fail">✗ import failed: ${err.message}</span>\n<span class="note">${err.stack || ''}</span>`;
  throw err;
}
out.textContent = ""; // clear "running…"
let n = 0, p = 0;
const log = (s, ok, err) => {
  out.innerHTML += `<span class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${s}${err ? ' — ' + err : ''}</span>\n`;
  n++; if (ok) p++;
};
const group = (s) => { out.innerHTML += `<span class="group">[${s}]</span>\n`; };
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;
const last = (a) => a[a.length - 1];

/* ─────── Math helpers ─────── */
group("math");
{
  const w = new Math_.RollingWindow(3);
  [1,2,3,4].forEach(x => w.push(x));
  log("rolling mean over [2,3,4]", w.mean() === 3);
  log("rolling stdev > 0", w.stdev() > 0);
  const e = new Math_.EMAState(3);
  // warm-up: SMA of first 3 = 2, then EMA
  const results = [1,2,3,4].map(x => e.next(x));
  log("EMA warm-up equals SMA at period", results[2] === 2);
  log("EMA step-4 = (4-2)*0.5+2 = 3", near(results[3], 3));
  const rmax = new Math_.RollingMax(3);
  [3,1,2,5,4].forEach(x => rmax.push(x));
  log("RollingMax over last3 [2,5,4]", rmax.value() === 5);
  log("trueRange with prevClose", Math_.trueRange(10, 5, 3) === 7);
}

/* ─────── Moving averages ─────── */
group("moving");
{
  // SMA(3) of [1,2,3,4,5]: NaN,NaN,2,3,4
  const s = Moving.sma([1,2,3,4,5], 3);
  log("SMA warm-up NaN", !Number.isFinite(s[1]));
  log("SMA(3)[2]=2, [4]=4", s[2] === 2 && s[4] === 4);
  // EMA(3) first defined = SMA(3) then step
  const e = Moving.ema([1,2,3,4,5], 3);
  log("EMA(3) warms to 2 at index 2", e[2] === 2);
  log("EMA(3) monotone on rising series", e[4] > e[3] && e[3] > e[2]);
  // WMA(3) of [1,2,3]: (1*1+2*2+3*3)/6 = 14/6
  const w = Moving.wma([1,2,3,4], 3);
  log("WMA(3)[2]=14/6", near(w[2], 14/6));
}

/* ─────── RSI ─────── */
group("rsi");
{
  // Monotone rising → RSI → 100
  const rising = Array.from({length: 30}, (_, i) => 100 + i);
  const r = Osc.rsi(rising, 14);
  log("RSI rising-only approaches 100", last(r) === 100);
  // Flat → RSI undefined early, then symmetric (split 0/0). We use 100 when avgLoss=0.
  const flat = Array(30).fill(50);
  const rf = Osc.rsi(flat, 14);
  log("RSI flat clamps to 100 (no losses)", last(rf) === 100);
  // Monotone falling → RSI → 0
  const falling = Array.from({length: 30}, (_, i) => 100 - i);
  const rd = Osc.rsi(falling, 14);
  log("RSI falling-only approaches 0", last(rd) === 0);
}

/* ─────── MACD ─────── */
group("macd");
{
  // just ensure alignment + warm-up
  const close = Array.from({length: 60}, (_, i) => 100 + Math.sin(i/6)*5);
  const m = Osc.macd(close);
  log("MACD returns three arrays", m.macd.length === 60 && m.signal.length === 60 && m.hist.length === 60);
  log("MACD signal NaN before 26+9-2", !Number.isFinite(m.signal[30]));
  log("MACD signal finite near end", Number.isFinite(last(m.signal)));
  log("hist = macd - signal at end", near(last(m.hist), last(m.macd) - last(m.signal), 1e-9));
}

/* ─────── BBands ─────── */
group("bbands");
{
  const close = Array.from({length: 40}, (_, i) => 100 + i);
  const { mid, up, lo } = Bands.bbands(close, 20, 2);
  log("BB mid warms at 19", Number.isFinite(mid[19]) && !Number.isFinite(mid[18]));
  log("BB up > mid > lo", last(up) > last(mid) && last(mid) > last(lo));
  log("BB mid equals SMA", near(last(mid), Moving.sma(close, 20)[close.length-1]));
}

/* ─────── ATR / ADX ─────── */
group("atr/adx");
{
  const n = 60;
  const high = [], low = [], close = [];
  for (let i = 0; i < n; i++) { high.push(100 + i + 1); low.push(100 + i - 1); close.push(100 + i); }
  const a = Vol.atr(high, low, close, 14);
  log("ATR warms after 14 bars", Number.isFinite(a[14]));
  log("ATR positive on trending series", last(a) > 0);
  const { adx: adxArr, plusDI, minusDI } = Vol.adx(high, low, close, 14);
  log("ADX on uptrend: plusDI > minusDI", last(plusDI) > last(minusDI));
  log("ADX value finite", Number.isFinite(last(adxArr)));
}

/* ─────── Stochastic ─────── */
group("stoch");
{
  const n = 30;
  const h = Array(n).fill(110);
  const l = Array(n).fill(90);
  const c = Array.from({length:n}, () => 100);
  const { k, d } = Osc.stochastic(h, l, c, 14, 3);
  log("stoch %K centered at 50 on midpoint close", last(k) === 50);
  log("stoch %D finite", Number.isFinite(last(d)));
}

/* ─────── VWAP / OBV / CMF ─────── */
group("vwap/obv/cmf");
{
  const h = [10, 11, 12, 11, 10, 12, 13];
  const l = [ 9, 10, 11, 10,  9, 11, 12];
  const c = [10, 11, 12, 10,  9, 12, 13];
  const v = [ 1,  1,  1,  1,  1,  1,  1];
  const vw = Volu.vwap(h, l, c, v, { mode: "rolling", period: 3 });
  log("VWAP length = input", vw.length === 7);
  log("VWAP last finite and between high/low", Number.isFinite(last(vw)) && last(vw) > 10 && last(vw) < 14);
  const ob = Volu.obv(c, v);
  // sequence 10→11↑ 11→12↑ 12→10↓ 10→9↓ 9→12↑ 12→13↑
  log("OBV cumulative correct", near(last(ob), 0 + 1 + 1 - 1 - 1 + 1 + 1));
  const cf = Volu.cmf(h, l, c, v, 3);
  log("CMF last finite", Number.isFinite(last(cf)));
}

/* ─────── Candle patterns ─────── */
group("patterns");
{
  const doji = { t: 1, o: 100, h: 101, l: 99, c: 100.01, v: 1 };
  log("doji detected", Patterns.isDoji(doji));
  const hammer = { t: 1, o: 101.2, h: 101.2, l: 97, c: 101, v: 1 }; // long lower shadow, no upper
  log("hammer detected", Patterns.isHammer(hammer));
  const ih = { t: 1, o: 101, h: 106, l: 101, c: 101.2, v: 1 };     // long upper shadow, no lower
  log("inverted hammer detected", Patterns.isInvertedHammer(ih));
  const p1 = { t: 1, o: 100, h: 100, l: 95, c: 95,  v: 1 }; // bear
  const c1 = { t: 2, o: 94,  h: 101,l: 94, c: 101, v: 1 };  // bull engulfs
  log("bull engulfing detected", Patterns.isBullishEngulfing(p1, c1));
  log("bear engulfing NOT detected", !Patterns.isBearishEngulfing(p1, c1));
  const mornA = { t:1, o:100,  h:100, l:90, c:90,   v:1 }; // bear
  const mornB = { t:2, o:89.5, h:92,  l:89, c:89.6, v:1 }; // tiny body, body/range = 0.1/3 ≈ 0.033
  const mornC = { t:3, o:91,   h:101, l:91, c:100,  v:1 }; // bull, close > midpoint(100,90)=95
  log("morning star detected", Patterns.isMorningStar(mornA, mornB, mornC));
  const hits = Patterns.detectAll([p1, c1]);
  log("detectAll finds engulfing", hits.some(h => h.patterns.includes("bullEngulf")));
}

/* ─────── Swings / trend / BoS / CHoCH ─────── */
group("structure");
{
  // Synthetic zigzag: up 5, down 3, up 6, down 4
  const candles = [];
  const add = (t, base) => candles.push({ t: t*60_000, o: base, h: base+0.5, l: base-0.5, c: base, v: 1 });
  let t = 0, price = 100;
  [1,2,3,4,5].forEach(x => add(t++, price += 1));   // up to 105
  [1,2,3].forEach(x => add(t++, price -= 1));       // down to 102
  [1,2,3,4,5,6].forEach(x => add(t++, price += 1)); // up to 108
  [1,2,3,4].forEach(x => add(t++, price -= 1));     // down to 104
  const piv = Swings.findPivots(candles, { left: 2, right: 2 });
  log("pivots found", piv.length >= 2);
  Swings.classifyPivots(piv);
  log("classified pivots have class", piv.every(p => typeof p.class === "string"));
  const trend = Swings.currentTrend(piv);
  log("currentTrend returns string", ["up","down","range","unknown"].includes(trend));
  // BoS / CHoCH
  const ev = Bos.detectBreaks(candles, piv);
  log("detectBreaks returns array", Array.isArray(ev));
}

/* ─────── FVG ─────── */
group("fvg");
{
  // craft an explicit bullish FVG: c[i-2].high < c[i].low
  const cs = [
    { t:1, o:100, h:101, l:99, c:100, v:1 },   // i=0
    { t:2, o:100, h:105, l:100, c:104, v:1 },  // i=1  strong bull
    { t:3, o:104, h:107, l:102, c:106, v:1 },  // i=2 (c[0].h=101 < c[2].l=102) → bull FVG
    { t:4, o:106, h:108, l:105, c:107, v:1 },  // i=3 no overlap
    { t:5, o:107, h:108, l:101, c:102, v:1 },  // i=4 wick into gap → mitigates
  ];
  const r = Fvg.detectFVG(cs);
  log("FVG created one bullish", r.mitigated.length === 1 || r.open.some(g => g.kind === "bull"));
  log("FVG bottom=101 top=102 area correct", r.mitigated[0]?.bottom === 101 && r.mitigated[0]?.top === 102);
}

/* ─────── S/R clustering ─────── */
group("levels");
{
  const pivs = [
    { i: 1, t: 1, price: 100.0, kind: "high" },
    { i: 2, t: 2, price: 100.2, kind: "high" },
    { i: 3, t: 3, price:  95.0, kind: "low" },
    { i: 4, t: 4, price:  94.9, kind: "low" },
    { i: 5, t: 5, price: 100.1, kind: "high" },
    { i: 6, t: 6, price:  95.1, kind: "low" },
  ];
  const lvls = SR.clusterLevels(pivs, { tolerance: 0.5, halfLifeBars: 10 });
  log("two clusters produced", lvls.length === 2);
  log("cluster near 100 has >= 3 touches", lvls.some(L => Math.abs(L.price - 100) < 0.3 && L.touches >= 3));
  log("strongest first", lvls[0].strength >= lvls[1].strength);
}

/* ─────── TAEngine end-to-end ─────── */
group("engine");
{
  // 250 bars synthetic
  const cs = [];
  for (let i = 0; i < 250; i++) {
    const base = 100 + Math.sin(i / 8) * 5 + i * 0.05;
    const o = base;
    const c = base + (Math.random() - 0.5) * 0.3;
    const h = Math.max(o, c) + 0.4;
    const l = Math.min(o, c) - 0.4;
    cs.push({ t: i * 60_000, o, h, l, c, v: 100 + i });
  }
  const ta = Eng.TAEngine.compute(cs);
  log("engine returns ema20/50/200 arrays", ta.ema20?.length === 250 && ta.ema50?.length === 250 && ta.ema200?.length === 250);
  log("engine returns rsi14 finite at end", Number.isFinite(last(ta.rsi14)));
  log("engine returns macd.hist finite at end", Number.isFinite(last(ta.macd_12_26_9.hist)));
  log("engine returns bb bands ordered", last(ta.bb_20_2.up) > last(ta.bb_20_2.mid) && last(ta.bb_20_2.mid) > last(ta.bb_20_2.lo));
  log("engine returns atr14 > 0", last(ta.atr14) > 0);
  log("engine returns pivots array", Array.isArray(ta.pivots));
  log("engine returns fvg object with open array", Array.isArray(ta.fvg?.open));
  log("engine returns levels ranked by strength", ta.levels.length >= 0 && (ta.levels.length < 2 || ta.levels[0].strength >= ta.levels[1].strength));
  log("summary has last.close + trend", Number.isFinite(ta.summary.last.close) && typeof ta.summary.trend === "string");
}

out.innerHTML += `\n${p}/${n} passed\n`;
document.title = `MNP p3 ${p}/${n}`;
</script>
</body>
</html>
