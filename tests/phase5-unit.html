<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MNP · Phase 5 unit tests</title>
<style>
  body { background:#131722; color:#d1d4dc; font:13px/1.5 monospace; padding:20px; }
  .pass { color:#26a69a; }
  .fail { color:#ef5350; }
  .group { margin-top: 12px; font-weight:bold; color:#2962ff; }
  h1 { color:#fff; font-size:18px; }
  #out { white-space: pre-wrap; }
  .note { color:#787b86; }
</style>
</head>
<body>
<h1>MNP — Phase 5 unit tests</h1>
<div id="out">running…</div>

<script type="module">
const out = document.getElementById("out");
window.addEventListener("error", (e) => {
  out.innerHTML = `<span class="fail">✗ ${e.message}</span>\n<span class="note">${e.filename}:${e.lineno}:${e.colno}</span>`;
});
window.addEventListener("unhandledrejection", (e) => {
  out.innerHTML = `<span class="fail">✗ unhandled: ${e.reason?.message || e.reason}</span>\n<span class="note">${e.reason?.stack || ''}</span>`;
});

const V = "p5-" + Date.now();
function findBase() {
  for (const u of [window.location?.href, document.baseURI, import.meta.url]) {
    if (u && !u.startsWith("data:") && !u.startsWith("blob:")) return u;
  }
  return window.location?.href || "file:///";
}
const BASE = findBase();
const IS_FILE = BASE.startsWith("file:");
const U = (p) => {
  const url = new URL(p, BASE).href;
  return IS_FILE ? url : `${url}?v=${V}`;
};

let Labels, Features, Normalize, Splits, FeatureStore, Eng, IDB;
try {
  [Labels, Features, Normalize, Splits, FeatureStore, Eng, IDB] = await Promise.all([
    import(U("../src/ml/labels.js")),
    import(U("../src/ml/features.js")),
    import(U("../src/ml/normalize.js")),
    import(U("../src/ml/splits.js")),
    import(U("../src/ml/featureStore.js")),
    import(U("../src/ta/engine.js")),
    import(U("../src/data/idb.js")),
  ]);
} catch (err) {
  out.innerHTML = `<span class="fail">✗ import failed: ${err.message}</span>\n<span class="note">${err.stack || ''}</span>`;
  throw err;
}
out.textContent = "";

let n = 0, p = 0;
const log = (s, ok, err) => {
  out.innerHTML += `<span class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${s}${err ? ' — ' + err : ''}</span>\n`;
  n++; if (ok) p++;
};
const group = (s) => { out.innerHTML += `<span class="group">[${s}]</span>\n`; };
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;
function mkCandle(t, o, h, l, c, v = 1) { return { t, o, h, l, c, v }; }

/* ─────── Labels: triple-barrier ─────── */
group("labels — triple-barrier");
{
  // Synthetic: price goes up through upper barrier quickly
  const close = [100, 101, 102, 103, 104, 105, 106, 107];
  const high  = [100, 101, 102, 103, 104, 105, 106, 107];
  const low   = [100, 101, 102, 103, 104, 105, 106, 107];
  const sigma = close.map(() => 2); // ±2 absolute
  const tb = Labels.tripleBarrier({ high, low, close, sigma, maxHorizon: 5, ptSl: [1, 1] });
  log("upward drift → upper touched (bar 0)", tb[0]?.touched === "upper" && tb[0]?.side === 1);
  log("return positive on upper", tb[0]?.ret > 0);

  // Downward — touches lower
  const close2 = [100, 99, 98, 97, 96];
  const high2 = close2.slice();
  const low2 = close2.slice();
  const tb2 = Labels.tripleBarrier({ high: high2, low: low2, close: close2, sigma: close2.map(() => 2), maxHorizon: 5, ptSl: [1, 1] });
  log("downward drift → lower touched", tb2[0]?.touched === "lower" && tb2[0]?.side === -1);

  // Flat — time barrier wins
  const close3 = [100, 100, 100, 100, 100, 100];
  const high3  = close3.slice();
  const low3   = close3.slice();
  const tb3 = Labels.tripleBarrier({ high: high3, low: low3, close: close3, sigma: close3.map(() => 5), maxHorizon: 3, ptSl: [1, 1] });
  log("flat → time barrier wins (side 0)", tb3[0]?.touched === "time" && tb3[0]?.side === 0);

  // Distribution
  const dist = Labels.labelDistribution(tb.map(x => x.side));
  log("labelDistribution returns counts", dist.total === tb.length && dist.pos >= 1);

  // Meta labels
  const primary = [1, 0, 0, 0, 0, 0, 0, 0];
  const meta = Labels.metaLabels(tb, primary);
  log("meta label = 1 when primary matches tb direction", meta[0] === 1);

  const primaryWrong = [-1, 0, 0, 0, 0, 0, 0, 0];
  const meta2 = Labels.metaLabels(tb, primaryWrong);
  log("meta label = 0 when primary opposes tb direction", meta2[0] === 0);

  // uniqueness weights > 0 and ≤ 1
  const w = Labels.uniquenessWeights(tb);
  log("uniqueness weights bounded (0,1]", w.every(x => x >= 0 && x <= 1));
}

/* ─────── Features ─────── */
group("features");
{
  // Build ~120 deterministic candles, sine-modulated
  const candles = [];
  const MIN = 60_000;
  let t = Date.UTC(2026, 0, 1, 0, 0, 0);
  for (let i = 0; i < 120; i++) {
    const base = 100 + Math.sin(i / 7) * 3 + i * 0.05;
    candles.push(mkCandle(t, base, base + 0.7, base - 0.7, base + Math.cos(i / 5) * 0.1, 1));
    t += MIN;
  }
  const ta = Eng.TAEngine.compute(candles);
  const fm = Features.buildFeatureMatrix(ta, { warmup: 50 });
  log("matrix is Float32Array", fm.matrix instanceof Float32Array);
  log("matrix shape n × d", fm.n === 120 && fm.d === Features.FEATURE_COUNT);
  log("names length = d", fm.names.length === fm.d);
  log("some rows valid after warmup", Array.from(fm.valid).filter(x => x).length > 0);
  const row80 = Features.rowAt(fm, 80);
  log("row is dense (all finite)", row80.every(Number.isFinite));
  log("row length = d", row80.length === fm.d);

  // stackWindows
  const win = Features.stackWindows(fm, 3);
  log("stackWindows n = n - k + 1", win.n === fm.n - 2);
  log("stackWindows d = k * d", win.d === 3 * fm.d);
  log("stacked names length matches", win.names.length === win.d);
}

/* ─────── Normalize ─────── */
group("normalize");
{
  // Fit z-score on 10 rows of 2 columns, col0 = [0..9], col1 = [1,1,...]
  const d = 2;
  const n = 10;
  const M = new Float32Array(n * d);
  for (let i = 0; i < n; i++) { M[i*d] = i; M[i*d+1] = 1; }
  const z = Normalize.fitZScore(M, d);
  log("zscore mean col0 ≈ 4.5", near(z.mean[0], 4.5, 1e-6));
  log("zscore std col0 > 0", z.std[0] > 0);
  log("zscore constant col pass-through (std=1)", z.std[1] === 1);
  const M2 = Normalize.applyStats(M, d, z);
  // Mean of transformed col0 should be ≈ 0
  let mean0 = 0;
  for (let i = 0; i < n; i++) mean0 += M2[i*d];
  mean0 /= n;
  log("post-zscore col0 mean ≈ 0", Math.abs(mean0) < 1e-5);

  const mm = Normalize.fitMinMax(M, d);
  const M3 = Normalize.applyStats(M, d, mm);
  log("post-minmax col0 first = -1", near(M3[0], -1, 1e-5));
  log("post-minmax col0 last = +1", near(M3[(n-1)*d], 1, 1e-5));

  // Apply on val-like subset (different rows) — should NOT re-fit
  const Vmat = new Float32Array([-5, 1, 20, 1]);
  const Vz = Normalize.applyStats(Vmat, d, z);
  log("applyStats doesn't re-fit (val has wider range)",
      Math.abs(Vz[0]) > Math.abs(M2[0]) && Math.abs(Vz[2]) > Math.abs(M2[(n-1)*d]));

  // Clipping
  const big = new Float32Array([10, -10, 3, -3]);
  Normalize.clipMatrix(big, 2, 5);
  log("clip at ±5", big[0] === 5 && big[1] === -5 && big[2] === 3 && big[3] === -3);
}

/* ─────── Splits ─────── */
group("splits — purged + embargoed");
{
  // 100 samples, t1 = i+5 (5-bar horizon)
  const t1 = Array.from({ length: 100 }, (_, i) => i + 5);
  const folds = Splits.purgedKFold(t1, { k: 5, embargo: 2 });
  log("5 folds returned", folds.length === 5);
  log("test folds cover all n without overlap", (() => {
    const seen = new Set();
    for (const f of folds) {
      for (const i of f.testIdx) {
        if (seen.has(i)) return false;
        seen.add(i);
      }
    }
    return seen.size === 100;
  })());
  // Purging: for fold 0 testIdx = [0..19], train samples i with t1[i] in [0..19]
  // means i in [0-5..19], i.e. i in [0..19], so no overlap → all train should be > 19 + embargo
  const f0 = folds[0];
  const minTrain = Math.min(...f0.trainIdx);
  log("fold0 train starts AFTER test + embargo", minTrain >= 20 + 2);
  // Fold 2 testIdx = [40..59]. Train shouldn't contain samples whose [i, i+5] overlaps [40..59] OR
  // samples in (59, 59 + 5 + embargo) = (59, 66]. So train near 60 should be absent.
  const f2 = folds[2];
  const bad = f2.trainIdx.filter(i => (i + 5) >= 40 && i <= 59);
  log("fold2 purging removes overlaps", bad.length === 0);
  const embargoed = f2.trainIdx.filter(i => i > 59 && i <= 66);
  log("fold2 embargo removes boundary", embargoed.length === 0);

  // walkForwardSplit
  const wf = Splits.walkForwardSplit(100, { trainFrac: 0.6, valFrac: 0.2, embargo: 2 });
  log("walkForward train end = 58", wf.trainIdx[wf.trainIdx.length - 1] === 57);
  log("walkForward val starts at 60", wf.valIdx[0] === 60);
  log("walkForward test starts at 80", wf.testIdx[0] === 80);

  // gather
  const M = new Float32Array([1,2, 3,4, 5,6, 7,8]);
  const gm = Splits.gatherRows(M, 2, [0, 2]);
  log("gatherRows copies correct rows", gm[0] === 1 && gm[1] === 2 && gm[2] === 5 && gm[3] === 6);
  const gl = Splits.gather(['a','b','c','d'], [1, 3]);
  log("gather picks correct labels", gl[0] === 'b' && gl[1] === 'd');
}

/* ─────── Feature store (IDB) ─────── */
group("featureStore (IDB)");
{
  try {
    await IDB.openDB();
    // Build mini dataset
    const candles = [];
    const MIN = 60_000;
    let t = Date.UTC(2026, 0, 10, 0, 0, 0);
    for (let i = 0; i < 80; i++) {
      const base = 100 + Math.sin(i/5) * 2;
      candles.push(mkCandle(t + i*MIN, base, base+0.5, base-0.5, base, 1));
    }
    const ta = Eng.TAEngine.compute(candles);
    const res = await FeatureStore.computeAndStore({
      symbol: "TEST-P5",
      tf: "1m",
      ta,
      Labels,
      tbOpts: { maxHorizon: 8, ptSl: [1.5, 1.5] },
      warmup: 50,
    });
    log("computeAndStore writes at least 1 row", res.written >= 1);
    log("distribution is an object", !!res.distribution && typeof res.distribution === "object");
    // Read back
    const rows = await FeatureStore.readFeatures({ symbol: "TEST-P5", tf: "1m" });
    log("readFeatures retrieves stored rows", rows.length === res.written);
    log("row has vec + label + version", rows[0] && Array.isArray(rows[0].vec) && rows[0].version === Features.FEATURE_VERSION);

    const ds = await FeatureStore.loadDataset({ symbol: "TEST-P5", tf: "1m" });
    log("loadDataset returns Float32Array", ds.matrix instanceof Float32Array && ds.n === rows.length);
    log("dataset d matches FEATURE_COUNT", ds.d === Features.FEATURE_COUNT);

    // Windowed
    const ds3 = await FeatureStore.loadDataset({ symbol: "TEST-P5", tf: "1m", window: 3 });
    log("windowed dataset n = rows - 2", ds3.n === Math.max(0, rows.length - 2));
    log("windowed dataset d = 3 * base-d", ds3.d === 3 * Features.FEATURE_COUNT);

    // Clean up test rows
    await IDB.withStore("features", "readwrite", (s) => new Promise((resolve, reject) => {
      const lo = ["TEST-P5","1m",0];
      const hi = ["TEST-P5","1m",8.64e15];
      const req = s.openCursor(IDBKeyRange.bound(lo, hi));
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        const cur = req.result;
        if (!cur) return resolve();
        cur.delete(); cur.continue();
      };
    }));
  } catch (err) {
    log("featureStore suite failed", false, err.message);
  }
}

out.innerHTML += `\n${p}/${n} passed\n`;
document.title = `MNP p5 ${p}/${n}`;
</script>
</body>
</html>
